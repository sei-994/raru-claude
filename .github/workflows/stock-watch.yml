name: iPhone 在庫監視

on:
  schedule:
    # 5分ごと（GitHub Actions の最短間隔）。混雑時は実行が10〜30分遅れることがある。
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード（初回は doctor で自己診断、find-parts で品番探索）'
        required: false
        default: 'check'
        type: choice
        options: [check, doctor, raw, find-parts, test]

permissions:
  contents: read

concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 前回の状態を復元
        uses: actions/cache/restore@v4
        with:
          path: tools/stock-watcher/apple-state.json
          key: apple-state-${{ github.run_id }}
          restore-keys: apple-state-

      - name: 在庫チェック
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APPLE_PARTS: ${{ vars.APPLE_PARTS }}
          APPLE_LOCATION: ${{ vars.APPLE_LOCATION }}
          APPLE_REGION: ${{ vars.APPLE_REGION || 'jp' }}
          APPLE_BUY_PAGE: ${{ vars.APPLE_BUY_PAGE }}
          STORE_FILTER: ${{ vars.STORE_FILTER }}
          MENTION: ${{ vars.MENTION }}
          # Actions は5分間隔なので、在庫継続中の再通知は控えめに
          REPEAT_MIN: ${{ vars.REPEAT_MIN || '60' }}
        run: |
          case "${{ inputs.mode || 'check' }}" in
            doctor)     node tools/stock-watcher/apple-stock.js --doctor ;;
            raw)        node tools/stock-watcher/apple-stock.js --raw ;;
            find-parts) node tools/stock-watcher/apple-stock.js --find-parts ;;
            test)       node tools/stock-watcher/apple-stock.js --test ;;
            *)          node tools/stock-watcher/apple-stock.js --check ;;
          esac

      - name: 構造確認用に生JSONを保存
        if: always() && inputs.mode == 'raw'
        uses: actions/upload-artifact@v4
        with:
          name: apple-raw-json
          path: tools/stock-watcher/apple-raw.json
          if-no-files-found: ignore

      - name: 状態を保存
        if: always() && inputs.mode != 'raw' && inputs.mode != 'find-parts' && inputs.mode != 'doctor'
        uses: actions/cache/save@v4
        with:
          path: tools/stock-watcher/apple-state.json
          key: apple-state-${{ github.run_id }}
